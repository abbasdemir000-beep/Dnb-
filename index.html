<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock App Preview</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, sans-serif;
      background: #070d1b;
      display: grid;
      place-items: center;
      color: #e5e7eb;
    }
    .card {
      width: min(980px, 96vw);
      border: 1px solid #223255;
      border-radius: 16px;
      padding: 18px;
      background: linear-gradient(180deg, #0f1a33, #0a1327);
      box-shadow: 0 24px 70px rgba(0,0,0,.45);
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 10px;
    }
    .ticker { font-weight: 700; letter-spacing: .03em; }
    .price { font-size: 1.8rem; font-weight: 700; }
    .delta.up { color: #34d399; }
    .delta.down { color: #f87171; }
    .meta { font-size: .85rem; color: #93a2be; }
    .controls { display: flex; gap: 8px; }
    button {
      background: #1f2d50;
      color: #dbe4ff;
      border: 1px solid #314771;
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
    }
    button:hover { background: #2a3b68; }
    svg {
      width: 100%;
      height: 400px;
      border-radius: 12px;
      background: #091327;
      display: block;
    }
    .grid line { stroke: rgba(147,162,190,.2); }
    #line { fill: none; stroke: #22d3ee; stroke-width: 3.2; stroke-linecap: round; }
    #area { fill: url(#fill); opacity: .45; }
    #dot { fill: #fff; stroke: #22d3ee; stroke-width: 2; }
  </style>
</head>
<body>
  <main class="card">
    <div class="top">
      <div>
        <div class="ticker">STOCK APP PREVIEW · DNBX</div>
        <div class="price" id="price">$152.40 <span id="delta" class="delta up">+0.00%</span></div>
        <div class="meta" id="meta">Simulated stream • updated just now</div>
      </div>
      <div class="controls">
        <button id="slower">Slower</button>
        <button id="faster">Faster</button>
      </div>
    </div>

    <svg viewBox="0 0 960 400" aria-label="Stock price preview chart">
      <defs>
        <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.55"></stop>
          <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.0"></stop>
        </linearGradient>
      </defs>
      <g class="grid" id="grid"></g>
      <path id="area"></path>
      <path id="line"></path>
      <circle id="dot" r="5"></circle>
    </svg>
  </main>

  <script>
    const svgW = 960, svgH = 400, pad = 24;
    const chartTop = pad, chartBottom = svgH - pad;
    const line = document.getElementById('line');
    const area = document.getElementById('area');
    const dot = document.getElementById('dot');
    const priceEl = document.getElementById('price');
    const deltaEl = document.getElementById('delta');
    const metaEl = document.getElementById('meta');
    const grid = document.getElementById('grid');
    const slowerBtn = document.getElementById('slower');
    const fasterBtn = document.getElementById('faster');

    for (let y = chartTop; y <= chartBottom; y += 53) {
      const h = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      h.setAttribute('x1', pad);
      h.setAttribute('x2', svgW - pad);
      h.setAttribute('y1', y);
      h.setAttribute('y2', y);
      grid.appendChild(h);
    }

    const points = Array.from({ length: 90 }, (_, i) => ({
      x: pad + i * ((svgW - pad * 2) / 89),
      y: 210 + Math.sin(i / 8) * 22 + (Math.random() - 0.5) * 18
    }));

    let basePrice = 152.4;
    let timerMs = 300;
    let timerId;

    function pathFrom(data) {
      let d = `M ${data[0].x} ${data[0].y}`;
      for (let i = 1; i < data.length; i++) d += ` L ${data[i].x} ${data[i].y}`;
      return d;
    }

    function render() {
      const d = pathFrom(points);
      line.setAttribute('d', d);
      const last = points[points.length - 1];
      area.setAttribute('d', `${d} L ${last.x} ${chartBottom} L ${points[0].x} ${chartBottom} Z`);
      dot.setAttribute('cx', last.x);
      dot.setAttribute('cy', last.y);

      const current = +(basePrice + (Math.random() - .49) * 0.9).toFixed(2);
      const pct = +(((current - 150) / 150) * 100).toFixed(2);
      priceEl.childNodes[0].nodeValue = `$${current.toFixed(2)} `;
      deltaEl.textContent = `${pct >= 0 ? '+' : ''}${pct.toFixed(2)}%`;
      deltaEl.className = `delta ${pct >= 0 ? 'up' : 'down'}`;
      metaEl.textContent = `Simulated stream • ${new Date().toLocaleTimeString()}`;
      basePrice = current;
    }

    function tick() {
      const prev = points[points.length - 1];
      points.shift();
      points.forEach((p, i) => p.x = pad + i * ((svgW - pad * 2) / 89));
      const nextY = Math.max(chartTop + 8, Math.min(chartBottom - 8, prev.y + (Math.random() - .5) * 28));
      points.push({ x: svgW - pad, y: nextY });
      render();
    }

    function restartTimer() {
      clearInterval(timerId);
      timerId = setInterval(tick, timerMs);
    }

    slowerBtn.onclick = () => { timerMs = Math.min(1200, timerMs + 120); restartTimer(); };
    fasterBtn.onclick = () => { timerMs = Math.max(80, timerMs - 120); restartTimer(); };

    render();
    restartTimer();
  </script>
</body>
</html>
